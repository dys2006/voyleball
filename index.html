<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>🏐 Волейбол — счёт</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;flex-direction:column}header{text-align:center;padding:15px;font-weight:700;font-size:22px}.sets{text-align:center;font-size:18px;color:#cbd5e1;margin-bottom:10px}.board{display:flex;flex:1;min-height:50vh;gap:8px;padding:8px}.team{flex:1;border:0;border-radius:20px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;min-width:0}.left{background:#1768d1}.right{background:#d43843}.name{font-size:clamp(16px,5vw,26px);font-weight:700}.score{font-size:clamp(65px,20vw,145px);font-weight:800;line-height:1.3}.hint{font-size:16px;opacity:.8}.controls{display:flex;gap:10px;padding:12px;padding-bottom:max(16px,env(safe-area-inset-bottom))}.controls button{flex:1;border:1px solid #64748b;border-radius:12px;background:#263348;color:white;font-size:18px;padding:18px 5px}.message{text-align:center;min-height:30px;font-weight:700;color:#fde68a}</style></head><body><header>🏐 Волейбол</header><div class="sets" id="sets">Сеты: 0 : 0</div><div class="message" id="message"></div><main class="board"><button class="team left" id="left"><span class="name">Левая</span><span class="score" id="a">0</span><span class="hint">+1 очко</span></button><button class="team right" id="right"><span class="name">Правая</span><span class="score" id="b">0</span><span class="hint">+1 очко</span></button></main><div class="controls"><button id="undo">↶ Отмена</button><button id="reset">Сброс</button></div><script>let state={a:0,b:0,sa:0,sb:0,history:[],finished:false};try{const saved=JSON.parse(localStorage.getItem('volleyball-score'));if(saved&&Number.isFinite(saved.a))state={...state,...saved}}catch(e){}function render(){document.getElementById('a').textContent=state.a;document.getElementById('b').textContent=state.b;document.getElementById('sets').textContent='Сеты: '+state.sa+' : '+state.sb;document.getElementById('message').textContent=state.finished?'Сет завершён. Нажмите команду для нового сета.':'';try{localStorage.setItem('volleyball-score',JSON.stringify(state))}catch(e){}}function point(side){state.history.push({a:state.a,b:state.b,sa:state.sa,sb:state.sb,finished:state.finished});if(state.finished){state.a=0;state.b=0;state.finished=false}state[side]++;if(Math.max(state.a,state.b)>=25&&Math.abs(state.a-state.b)>=2){state[state.a>state.b?'sa':'sb']++;state.finished=true}render()}document.getElementById('left').addEventListener('click',()=>point('a'));document.getElementById('right').addEventListener('click',()=>point('b'));document.getElementById('undo').addEventListener('click',()=>{if(state.history.length){const old=state.history.pop();Object.assign(state,old);render()}});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Сбросить счёт и сеты?')){state={a:0,b:0,sa:0,sb:0,history:[],finished:false};render()}});render();</script></body></html>
